name: Build METRA FieldClimate Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable debug APK
        run: gradle -p android assembleDebug

      - name: Prepare APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk METRA-Weather.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: METRA-Weather-Android-APK
          path: METRA-Weather.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: METRA FieldClimate Android
          target_commitish: main
          body: "Latest installable Android APK. The app loads the live FieldClimate dashboard, so website updates appear without reinstalling the app."
          files: METRA-Weather.apk
          overwrite_files: true
          make_latest: true
